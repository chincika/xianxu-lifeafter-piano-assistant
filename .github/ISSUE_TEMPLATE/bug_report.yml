name: Bug 报告
description: 报告程序错误或兼容性问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: 程序版本
      placeholder: 请填写“帮助与安全”中显示的版本号
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请勿上传版权音乐、账号信息或个人数据。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断日志（可选）
      description: 在“帮助与安全”开启诊断日志，复现问题后导出 ZIP。请先检查内容，再将 ZIP 拖到此处上传。日志默认关闭，重启后需重新开启，不会自动上传；不要附加音乐文件或账号信息。
  - type: textarea
    id: details
    attributes:
      label: 其他信息
      description: 可填写游戏版本/地区、进程名、音区和完整错误提示。
