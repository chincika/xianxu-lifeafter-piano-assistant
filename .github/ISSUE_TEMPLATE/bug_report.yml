name: Bug 报告
description: 报告程序错误或兼容性问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: 程序版本
      placeholder: v0.1.0-beta.2
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请勿上传版权音乐、账号信息或个人数据。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 其他信息
      description: 可填写游戏版本/地区、进程名、音区和完整错误提示。
